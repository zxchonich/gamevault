{% comment %}Значок досягнення GameVault (тег site_badge): SVG зі services/badge_styles.py, кольори — змінні рівня в gv.css.{% endcomment %}
{% if badge %}<span class="gv-badge gv-badge--{{ style }} gv-badge--{{ tier_class }}{% if size %} gv-badge--{{ size }}{% endif %}{% if locked %} is-locked{% endif %}" title="{% if hidden %}Секретне досягнення{% else %}{{ badge.title }}{% if tier_name and not locked %} · {{ tier_name }}{% endif %}{% endif %}">{{ svg }}</span>{% endif %}
